spring.application.name=ms-productos
spring.main.banner-mode=off
server.port=8889
server.servlet.context-path=/ms-productos

#productos
productos.mapping=/productos

#MySQL DOCKER CONNECTION
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Sin inspección ni cambios de esquema al arrancar (antes: update)
spring.jpa.hibernate.ddl-auto=none
#spring.jpa.properties.hibernate.dialect=org.hibernate.d+ialect.MySQL8Dialect

# ===== HIKARI DC =====
# ===== Identificación =====
spring.datasource.hikari.pool-name=MsProductosPool

# ===== Tamaño del pool =====
# Tamaño fijo: min-idle = max evita crear conexiones en pleno pico
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=20

# ===== Timeouts =====
# Cuánto espera un thread por una conexión antes de fallar (default 30s, demasiado)
spring.datasource.hikari.connection-timeout=3000
# Tiempo máximo para validar que una conexión está viva
spring.datasource.hikari.validation-timeout=2000
# Solo aplica si minimum-idle < maximum-pool-size
spring.datasource.hikari.idle-timeout=600000
# Vida máxima de una conexión: debe ser MENOR que el timeout de la BD/red
spring.datasource.hikari.max-lifetime=1500000
# Ping periódico para que firewalls/proxies no corten conexiones inactivas
spring.datasource.hikari.keepalive-time=300000

# ===== Detección de fugas =====
# Loguea un warning si una conexión no se devuelve en 10s
spring.datasource.hikari.leak-detection-threshold=10000

# ===== Transacciones =====
spring.datasource.hikari.auto-commit=false
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# ===== MUY importante con JPA =====
# Evita que la conexión quede tomada durante todo el request (incluida la serialización)
spring.jpa.open-in-view=false

# ===== Hikari MySQL =====
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true

# ===== Rendimiento =====
# Evita páginas gigantes (?size=2000 era válido)
spring.data.web.pageable.max-page-size=100
# Compresión gzip de respuestas JSON grandes
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=2KB
# Caché local (una sola instancia): TTL corto para listados y búsqueda por SKU
spring.cache.type=caffeine
spring.cache.cache-names=productos,productoPorSku
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=60s,recordStats

# ===== Actuator / métricas =====
management.endpoints.web.exposure.include=health,metrics,prometheus,caches

#HERRAMIENTA DE MIGRACION
#Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
