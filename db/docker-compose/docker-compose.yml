networks:
  app-network-public:
    driver: bridge

volumes:
  mysql-data:
    driver: local

services:
  db:
    image: mysql:5.7
    container_name: db-mysql
    restart: always
    networks:
      - app-network-public
    env_file: 
      mysql.env
    ports:
      # <Port exposed> : < MySQL Port running inside container>
      - '3306:3306'
    expose:
      # Opens port 3306 on the container
      - '3306'
      # Where our data will be persisted
    volumes:
      - mysql-data:/var/lib/mysql